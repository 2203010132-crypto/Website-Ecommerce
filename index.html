<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Skyline Cloth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        .login-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        .login-card h2 {
            color: #333;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .btn-login {
            background-color: #007bff;
            color: #fff;
            font-weight: bold;
            border-radius: 5px;
        }
        .btn-login:hover {
            background-color: #0056b3;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-container img {
            max-width: 80px;
            border-radius: 50%;
        }
        .form-control {
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: box-shadow 0.3s, transform 0.3s;
        }
        .form-control:focus {
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.5), 0 2px 5px rgba(0, 0, 0, 0.2);
            border-color: #007bff;
            transform: translateY(-2px);
            outline: none;
        }
        .logo-index {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 10px;
            display: block;
            margin: 0 auto 20px auto;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <img src="logo.jpg" class="logo-index" alt="Logo Skyline Cloth"> <!-- Pastikan file logo.jpg tersedia -->
        </div>
        <h2>Login Admin</h2>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan Username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan Password" required>
            </div>
            <button type="submit" class="btn btn-login w-100">Login</button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Validasi username dan password (simulasi)
            if (username === 'admin' && password === 'admin123') {
                localStorage.setItem('isLoggedIn', 'true'); // Simpan status login
                window.location.href = 'menu.html'; // Redirect ke dashboard
            } else {
                alert('Username atau Password salah!');
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
